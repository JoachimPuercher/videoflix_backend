{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Videoflix account activation</title>
</head>
<body style="margin:0; padding:0; background:#ffffff;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#ffffff;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="max-width:600px; width:100%;">

          <!-- Logo -->
          <tr>
            <td align="center" style="padding:0 0 32px;">
              <img src="{% static 'auth_app/logo.png' %}" alt="Videoflix" width="240" style="display:block; width:240px; max-width:100%; height:auto; border:0;">
            </td>
          </tr>

          <!-- Headline -->
          <tr>
            <td style="padding:0 0 16px; font-family:'Google Sans', Roboto, Arial, Helvetica, sans-serif; font-size:24px; line-height:32px; font-weight:bold; color:#202124;">
              {{ title }}
            </td>
          </tr>

          <!-- Message -->
          <tr>
            <td style="padding:0 0 32px; font-family:'Google Sans', Roboto, Arial, Helvetica, sans-serif; font-size:16px; line-height:24px; color:#202124;">
              {{ message }}
            </td>
          </tr>

          <!-- Button -->
          <tr>
            <td align="left" style="padding:0 0 32px;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td align="center" bgcolor="#2A35D9" style="border-radius:32px;">
                    <a href="{{ FRONTEND_URL }}" style="display:inline-block; padding:16px 40px; font-family:'Google Sans', Roboto, Arial, Helvetica, sans-serif; font-size:18px; font-weight:bold; line-height:22px; color:#ffffff; text-decoration:none; border-radius:32px;">
                      Go to login
                    </a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Sign-off -->
          <tr>
            <td style="padding:0 0 24px; font-family:'Google Sans', Roboto, Arial, Helvetica, sans-serif; font-size:16px; line-height:24px; color:#202124;">
              Best regards,
            </td>
          </tr>
          <tr>
            <td style="padding:0; font-family:'Google Sans', Roboto, Arial, Helvetica, sans-serif; font-size:16px; line-height:24px; color:#202124;">
              Your Videoflix Team.
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
